<svg viewBox="0 0 240 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashed Flight Trail (Contained loop in left whitespace) -->
  <path
    d="M 155 35 C 130 55 95 65 72 50 C 52 35 62 18 85 18 C 108 18 112 50 90 78 C 70 102 38 112 5 120"
    stroke="#94a3b8"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-dasharray="5 6"
  />

  <!-- Subtle Pink Outlined Circle (Karlson signature accent) -->
  <circle cx="22" cy="32" r="7" stroke="#f87171" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Origami Paper Airplane (Facing Up-Right, pointing towards CTA) -->
  <g transform="translate(145, 8) rotate(15)">
    <!-- Main Top Wing (Sky Blue) -->
    <polygon points="75,0 35,72 16,46" fill="#93c5fd" />
    
    <!-- Center Fold / Spine (Royal Blue) -->
    <polygon points="75,0 16,46 0,55" fill="#60a5fa" />
    
    <!-- Left Wing (Light Powder Blue) -->
    <polygon points="75,0 0,55 20,26" fill="#bfdbfe" />
    
    <!-- Underside Shadow Keel -->
    <polygon points="16,46 35,72 25,76" fill="#2563eb" opacity="0.9" />
  </g>
</svg>
